<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Name Card – wilgat</title>

  <!-- PWA essentials -->
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="./manifest.json"/>

  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0a0a0a;
      color: #eee;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 16px 0 24px;
      font-size: 1.8rem;
      text-align: center;
    }
    .card-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 32px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      background: #111;
    }
    .card-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .qr-section {
      text-align: center;
      margin: 32px 0 48px;
    }
    .qr-section img {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      background: white;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .qr-section p {
      margin: 16px 0 8px;
      font-size: 1.1rem;
      color: #ccc;
    }

    /* Install button – floating style */
    #install-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: all 0.2s;
    }
    #install-btn:hover {
      background: #3385ff;
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      h1 { font-size: 1.2rem; }
      .qr-section img { width: 200px; height: 200px; }
      #install-btn {
        bottom: 16px;
        right: 16px;
        padding: 10px 20px;
      }
    }
    .qr-section img {
        width: 140px;
        height: 140px;
    /* ... rest unchanged */
    }
  </style>
</head>
<body>

  <h1>Wilgat Digital Name Card</h1>

  <div class="card-container">
    <img src="namecard.png" alt="Name Card"/>
  </div>

  <div class="qr-section">
    <img src="qr.png" alt="QR Code to this page"/>
    <p>Scan to open this page</p>
  </div>
  
  <button id="install-btn">Install App</button>

  <!-- PWA install handling -->
  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';   // make sure it's visible
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        alert("Install prompt not available.\n\nTry:\n• Chrome/Edge → menu → Install\n• Mobile → Add to Home Screen");
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log("Install outcome:", outcome);
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      console.log('PWA was installed');
    });

    // Show button if already possible
    installBtn.style.display = 'block';
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
